defaults:
  app_name: "RLALab AI Research Assistant"
  app_env: "development"
  log_level: "INFO"
  cors_origins:
    - "http://localhost:3000"
  app_public_url: "http://localhost:3000"

  database_url: "postgresql+asyncpg://postgres:postgres@localhost:5432/rlalab_ai"

  secret_key: "CHANGE_ME_IN_PRODUCTION"
  access_token_expire_minutes: 480
  invitation_token_expire_hours: 168

  sendgrid_api_key: ""
  sendgrid_from_email: ""
  sendgrid_from_name: "RLALab AI Assistant"
  sendgrid_api_url: "https://api.sendgrid.com/v3/mail/send"
  sendgrid_timeout_s: 30

  llm_provider: "anthropic"
  llm_model: "claude-sonnet-4-6"
  anthropic_api_key: ""
  llm_max_tokens: 2048
  llm_temperature: 0.1
  llm_stream_timeout_s: 120
  llm_first_token_timeout_s: 10

  embedding_model: "pubmedbert"
  embedding_batch_size: 32
  embedding_cache_dir: "./model_cache"
  tokenizers_parallelism: "false"

  ncbi_email: ""
  ncbi_api_key: ""
  ncbi_sleep_between_batches_s: 0.15

  retrieval_vector_top_k: 10
  retrieval_lexical_top_k: 10
  retrieval_final_top_k: 5
  reranker_enabled: false
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

environments:
  development:
    app_env: "development"
    log_level: "INFO"
    cors_origins:
      - "http://localhost:3000"
    app_public_url: "http://localhost:3000"

  production:
    app_env: "production"
    log_level: "INFO"
    cors_origins:
      - "https://assistant.rlalab.imperial.ac.uk"
    app_public_url: "https://assistant.rlalab.imperial.ac.uk"
    tokenizers_parallelism: "false"

  deployed:
    app_env: "production"
    log_level: "INFO"
    cors_origins:
      - "https://assistant.rlalab.imperial.ac.uk"
    app_public_url: "https://assistant.rlalab.imperial.ac.uk"
