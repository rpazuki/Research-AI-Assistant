[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlalab-ai-assistant-backend"
version = "0.1.0"
description = "RLALab AI Research Assistant — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Settings
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # LLM providers
    "anthropic>=0.40.0",

    # Embeddings
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "torch>=2.3.0",

    # Resilience
    "tenacity>=8.3.0",

    # Logging
    "structlog>=24.0.0",

    # HTTP
    "httpx>=0.27.0",
    "biopython>=1.83",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
