[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "rlalab-ai-assistant-backend"
version = "0.1.0"
description = "RLALab AI Research Assistant — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",

    # Settings
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # LLM providers
    "anthropic>=0.40.0",

    # Embeddings
    # Keep the HF stack compatible with torch 2.2.x in local/dev environments.
    # transformers 4.52+ enforce a torch>=2.6 safety floor at load time.
    "sentence-transformers>=3.0.0,<4.0",
    "transformers>=4.40.0,<4.52",
    "torch>=2.2.0",
    "numpy<2.0",

    # Resilience
    "tenacity>=8.3.0",

    # Logging
    "structlog>=24.0.0",

    # HTTP
    "httpx>=0.27.0",
    "biopython>=1.83",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
]
