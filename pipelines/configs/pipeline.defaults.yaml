defaults:
  runtime:
    # Local scenario (host process -> Compose db on its published port).
    # Must match Settings.database_url's default in backend/app/core/config.py —
    # test_pipeline_config.py asserts they agree.
    # compose/server receive DATABASE_URL from .env.compose / .env.server, which
    # apply_pipeline_env_overrides() prefers over this value.
    database_url: "postgresql+asyncpg://postgres:postgres@localhost:5433/rlalab_ai"
    progress_interval_documents: 100

  cache:
    checkpoint_dir: "./data/checkpoints"

  pubmed:
    batch_size: 20
    sleep_between_batches_s: 0.15
    max_retries: 5
    retry_backoff_base_s: 1.0

  pmc:
    sleep_between_batches_s: 0.5
    http:
      attempts: 4
      timeout_s: 30
      retry_backoff_base_s: 2.0
      retry_backoff_max_s: 30.0

  discovery:
    sources:
      - "pubmed"
      - "europepmc"
      - "crossref"
      - "openalex"
    max_records_per_source: 5000
    include_mentions: false
    include_reviews: false
    collapse_preprint_versions: true
    check_retraction_notices: false
    http:
      attempts: 3
      timeout_s: 30
    # Contact addresses are not set here. They are secrets-file material
    # (CROSSREF_MAILTO / OPENALEX_MAILTO in .env), and both fall back to
    # NCBI_EMAIL, which is the address guaranteed to be configured.

  datasheet:
    # Shared defaults for the three datasheet_* sources, the way `local:`
    # serves the four lab sources.
    fetch_fulltext: true
    skip_metadata_only: true
    min_relevance: "studies"
    include_reviews: false
    chunk_by_section: true
    access_status: "internal"
    sensitivity: "internal"
    retention_policy: "internal-project-storage"

  pdf:
    dir: "./data/pdfs"

  local:
    access_status: "internal"
    sensitivity: "internal"
    retention_policy: "internal-project-storage"
    text_suffixes:
      - ".md"
      - ".markdown"
      - ".txt"
    table_suffixes:
      - ".csv"
      - ".tsv"

  chunking:
    chunk_size: 512
    chunk_overlap: 64

  indexing:
    embedding_batch_size: 2
    embedding_batch_size_by_source:
      pubmed_abstract: 32
    ivfflat_lists: 100

  deduplication:
    enabled: true
    match_on_pmid: true
    match_on_document_id: true
    match_on_title: true
    title_threshold: 0.92

  acquisition:
    default_access_status: "licensed-access"
    default_sensitivity: "licensed"
    default_retention_policy: "internal-project-storage"
    allowed_asset_suffixes:
      - ".pdf"
      - ".xml"
      - ".txt"
    allowed_access_methods:
      - "imperial-library"
      - "imperial-vpn"
      - "shibboleth"
      - "publisher-tdm"
      - "author-provided"
      - "manual-upload"

# Selected by RLALAB_ENV = local | compose | server (see run_and_deploy.md §2).
# Addresses are deliberately absent here: `local` uses the defaults above, and
# compose/server get DATABASE_URL injected from .env.compose / .env.server.
environments:
  local: {}

  compose: {}

  server:
    runtime:
      progress_interval_documents: 250
