# RLALab corpus configuration
# Edit query and date range to tune the ingestion scope.
# Commit this file; secrets (NCBI_EMAIL, NCBI_API_KEY) stay in .env.

[corpus]
name            = "rlalab-pubmed-v1"
source          = "pubmed_abstract"          # 'pubmed_abstract' | 'pmc_fulltext' | 'pdf'
embedding_model = "pubmedbert"               # 'pubmedbert' | 'minilm'

[pubmed]
# Search query for the RLA Lab domain.
# Covers: synthetic biology, metabolic engineering, Y. lipolytica, microbial cell factories,
# oleaginous organisms, sustainable protein, lipids, carotenoids, microbial communities.
# Expand or narrow this query to tune corpus scope.
query = """
(
  "synthetic biology"[Title/Abstract] OR
  "metabolic engineering"[Title/Abstract] OR
  "Yarrowia lipolytica"[Title/Abstract] OR
  "Yarrowia"[Title/Abstract] OR
  "oleaginous yeast"[Title/Abstract] OR
  "microbial cell factory"[Title/Abstract] OR
  "lipid production"[Title/Abstract] OR
  "lipid biosynthesis"[Title/Abstract] OR
  "carotenoid production"[Title/Abstract] OR
  "fatty acid production"[Title/Abstract] OR
  "bioproduction"[Title/Abstract] OR
  "microbial community"[Title/Abstract] OR
  "synthetic microbial"[Title/Abstract] OR
  "sustainable protein"[Title/Abstract] OR
  "single cell protein"[Title/Abstract] OR
  "fermentation engineering"[Title/Abstract] OR
  "CRISPR metabolic"[Title/Abstract] OR
  "genome scale model"[Title/Abstract]
) AND english[lang]
"""

year_from               = 2000
year_to                 = 2026
batch_size              = 20
sleep_between_batches_s = 0.15

[chunking]
chunk_size    = 512    # words (approximate tokens)
chunk_overlap = 64     # words

# Shared runtime defaults such as checkpoint paths, retries, deduplication,
# and progress cadence live in pipelines/configs/pipeline.defaults.yaml.
