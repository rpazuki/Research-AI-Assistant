# RLALab corpus configuration — internal inventory exports (CSV/TSV).

[corpus]
name            = "rlalab-inventories-v1"
source          = "inventories"  # or "eln_lims" / "omics_summaries"
embedding_model = "pubmedbert"

[inventories]
dir = "./data/inventories"
access_status = "internal"
sensitivity = "confidential"
max_rows = 500