services:
  # ── Postgres + pgvector ──────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: rlalab_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_backend
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      ALEMBIC_DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/app/model_cache   # Persistent volume for embedding model weights
      - corpus_data:/app/data           # Corpus caches, uploads, and ingestion artifacts
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_ingestion_worker
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      ALEMBIC_DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: python -m app.ingestion.worker

  evaluation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_evaluation_worker
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      ALEMBIC_DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: python -m app.evaluation.worker

  # ── Next.js frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rlalab_frontend
    env_file: .env
    environment:
      FRONTEND_ENV: ${FRONTEND_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_API_PROXY_PREFIX: ${NEXT_PUBLIC_API_PROXY_PREFIX}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  model_cache:
  corpus_data:
