services:
  # ── Postgres + pgvector ──────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: rlalab_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Published so host tools (psql, alembic, a host-run backend) can reach it.
      # 5433 avoids clashing with a native Postgres on 5432. Matches the local
      # default in backend/app/core/config.py.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_backend
    env_file:
      - .env
      - .env.compose
    environment:
      RLALAB_ENV: compose
      # One owner for the password: .env. Compose interpolates ${VAR} from the
      # shell and the project .env only — a service-level env_file: is NOT a
      # source for it — so the URL is assembled here rather than duplicated in
      # .env.compose, where it could silently drift from POSTGRES_PASSWORD.
      # A password containing @ : / # or ? must be percent-encoded.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/app/model_cache   # Persistent volume for embedding model weights
      - corpus_data:/app/data           # Corpus caches, uploads, and ingestion artifacts
    command: >
      sh -c "python -m app.db.preflight && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_ingestion_worker
    env_file:
      - .env
      - .env.compose
    environment:
      RLALAB_ENV: compose
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: sh -c "python -m app.db.preflight && python -m app.ingestion.worker"

  evaluation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_evaluation_worker
    env_file:
      - .env
      - .env.compose
    environment:
      RLALAB_ENV: compose
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: sh -c "python -m app.db.preflight && python -m app.evaluation.worker"

  # ── Next.js frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rlalab_frontend
    env_file:
      - .env
      - .env.compose
    environment:
      # The frontend derives the backend URL from frontend/configs/frontend.yaml
      # keyed on this selector — no URL is passed in, so nothing can override it.
      RLALAB_ENV: compose
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  model_cache:
  corpus_data:
