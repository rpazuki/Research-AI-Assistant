services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rlalab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Do NOT expose 5432 in production

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_backend
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
      # One owner for the password: .env. Compose interpolates ${VAR} from the
      # shell and the project .env only — a service-level env_file: is NOT a
      # source for it — so the URL is assembled here rather than duplicated in
      # .env.server, where it could silently drift from POSTGRES_PASSWORD.
      # A password containing @ : / # or ? must be percent-encoded.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    expose:
      - "8000"
    command: >
      sh -c "python -m app.db.preflight && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_ingestion_worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: sh -c "python -m app.db.preflight && python -m app.ingestion.worker"

  evaluation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_evaluation_worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: sh -c "python -m app.db.preflight && python -m app.evaluation.worker"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rlalab_frontend
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      # The frontend derives the backend URL from frontend/configs/frontend.yaml
      # keyed on this selector — no URL is passed in, so nothing can override it.
      RLALAB_ENV: server
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: rlalab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  model_cache:
  corpus_data:
