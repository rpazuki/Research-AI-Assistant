services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rlalab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Do NOT expose 5432 in production

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_backend
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_ingestion_worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: python -m app.ingestion.worker

  evaluation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_evaluation_worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: python -m app.evaluation.worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rlalab_frontend
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      # The frontend derives the backend URL from frontend/configs/frontend.yaml
      # keyed on this selector — no URL is passed in, so nothing can override it.
      RLALAB_ENV: server
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: rlalab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  model_cache:
  corpus_data:
