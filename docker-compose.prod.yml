services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rlalab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Do NOT expose 5432 in production

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_backend
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
      # One owner for the password: .env. Compose interpolates ${VAR} from the
      # shell and the project .env only — a service-level env_file: is NOT a
      # source for it — so the URL is assembled here rather than duplicated in
      # .env.server, where it could silently drift from POSTGRES_PASSWORD.
      # A password containing @ : / # or ? must be percent-encoded.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    expose:
      - "8000"
    command: >
      sh -c "python -m app.db.preflight && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_ingestion_worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: sh -c "python -m app.db.preflight && python -m app.ingestion.worker"

  evaluation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rlalab_evaluation_worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      RLALAB_ENV: server
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - model_cache:/app/model_cache
      - corpus_data:/app/data
    command: sh -c "python -m app.db.preflight && python -m app.evaluation.worker"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rlalab_frontend
    restart: unless-stopped
    env_file:
      - .env
      - .env.server
    environment:
      # The frontend derives the backend URL from frontend/configs/frontend.yaml
      # keyed on this selector — no URL is passed in, so nothing can override it.
      RLALAB_ENV: server
      # `server` in frontend.yaml marks the auth cookie Secure, which a browser
      # discards over plain HTTP — login appears to succeed and bounces straight
      # back. Serving without TLS therefore REQUIRES FRONTEND_AUTH_COOKIE_SECURE=false
      # in .env. Defaulting to true keeps the safe behaviour when nothing is set,
      # so the failure is a visible login loop rather than a silent downgrade.
      FRONTEND_AUTH_COOKIE_SECURE: ${FRONTEND_AUTH_COOKIE_SECURE:-true}
    ports:
      # Next.js listens on 3000 inside the container; only the host side moves.
      # Default 80 serves the app directly, which is the whole stack when no TLS
      # certificate exists. Running the `tls` profile below puts nginx on 80/443
      # instead, so set FRONTEND_HOST_PORT=3000 in .env to free the port.
      - "${FRONTEND_HOST_PORT:-80}:3000"
    depends_on:
      - backend

  # Only started by `--profile tls`. Off by default because it needs
  # ./nginx/nginx.conf and a certificate in ./nginx/ssl, neither of which is in
  # the repo — and because it would otherwise contend with the frontend for 80.
  # Nothing else depends on it: the browser only ever talks to the frontend
  # origin, which proxies to the backend server-side via /api/backend/*.
  nginx:
    image: nginx:alpine
    container_name: rlalab_nginx
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  model_cache:
  corpus_data:
