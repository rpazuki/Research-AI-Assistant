defaults:
  evaluation_env: "local"
  api_url: "http://localhost:8000"
  default_mode: "retrieval"
  question_id: null
  token: ""

  benchmark_file: "benchmark/questions.jsonl"
  reports_dir: "reports"
  report_prefix: "eval"

  retrieval_timeout_s: 30
  rag_timeout_s: 120
  retrieval_top_k: 20
  mrr_at_k: 10
  session_mode: "researcher"

# Selected by RLALAB_ENV. This file is the single owner of "which API does the
# evaluation runner talk to".
environments:
  # Runner on the host, backend on its published port.
  local:
    evaluation_env: "local"
    api_url: "http://localhost:8000"

  # Runner inside Compose, backend by service name.
  compose:
    evaluation_env: "compose"
    api_url: "http://backend:8000"

  # Runner pointed at the deployed instance through nginx.
  server:
    evaluation_env: "server"
    api_url: "https://assistant.rlalab.imperial.ac.uk"
